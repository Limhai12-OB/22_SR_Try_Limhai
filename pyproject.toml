[project]
name = "local-rag-homework"
version = "0.1.0"
description = "A local Naive RAG terminal app using Ollama and Chroma"
authors = [{name = "Try Limhai"}]
readme = "README.md"
dynamic = ["dependencies"]
requires-python = ">=3.11,<3.15"

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
chromadb = ">=1.5.9,<2"
ollama = ">=0.6.2,<1"
pypdf = ">=6.18,<7"
fastapi = ">=0.141.1,<1"
pydantic = ">=2.13.5,<3"
uvicorn = ">=0.52.4,<1"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"
httpx = ">=0.28.1,<1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
